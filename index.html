<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Heeeeat!伏見桃山の口コミ作成サポートページ">
<title>Heeeeat! 口コミ作成サポート</title>
<style>
:root{--brand:#f28c28;--brand-dark:#c9680f;--bg:#fff8f1;--card:#fff;--text:#2b2b2b;--muted:#6b7280;--border:#eadfd3;--success:#1f7a4d;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",Meiryo,sans-serif}.wrap{width:min(100%,680px);margin:auto;padding:18px 14px 48px}.hero,.card{background:var(--card);border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.06)}.hero{padding:24px 18px;text-align:center}.brand{display:inline-flex;align-items:center;justify-content:center;width:70px;height:70px;border-radius:18px;background:var(--brand);color:#fff;font-weight:800;font-size:22px;margin-bottom:12px}h1{margin:0;font-size:23px;line-height:1.45}.lead{margin:10px 0 0;color:var(--muted);font-size:14px;line-height:1.75}.privacy{margin-top:14px;display:inline-block;font-size:12px;color:var(--success);background:#eef8f2;padding:7px 10px;border-radius:999px}.card{margin-top:14px;padding:18px}.section-title{margin:0 0 12px;font-size:17px}.section-note{margin:-5px 0 12px;color:var(--muted);font-size:12px}.stars{display:flex;justify-content:center;gap:7px}.star{border:0;background:transparent;color:#d8d8d8;font-size:38px;cursor:pointer}.star.on{color:#f2b43c}.chips{display:flex;flex-wrap:wrap;gap:9px}.chip{border:1px solid var(--border);background:#fff;border-radius:999px;padding:10px 13px;font-size:14px;cursor:pointer}.chip.selected{border-color:var(--brand);background:#fff1e2;color:#82430b;font-weight:700}textarea{width:100%;min-height:94px;border:1px solid var(--border);border-radius:14px;padding:13px;font:inherit;resize:vertical}.btn{width:100%;border:0;border-radius:14px;padding:15px 16px;font-size:16px;font-weight:750;cursor:pointer;margin-top:12px}.primary{background:var(--brand);color:#fff}.secondary{background:#fff;color:var(--brand-dark);border:1px solid var(--brand)}.error{min-height:22px;margin-top:9px;color:var(--danger);font-size:13px;text-align:center}.result{display:none}.review-box{min-height:145px;padding:15px;border:1px solid #efd4b8;border-radius:14px;background:#fffdfa;line-height:1.8;white-space:pre-wrap}.meta{display:flex;justify-content:space-between;margin-top:8px;color:var(--muted);font-size:12px}.notice{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.65}.success{color:var(--success);font-weight:700;text-align:center;min-height:22px;margin-top:8px}footer{margin-top:22px;color:var(--muted);font-size:11px;text-align:center;line-height:1.7}
</style>
</head>
<body>
<main class="wrap">
<section class="hero"><div class="brand">H!</div><h1>Heeeeat!伏見桃山<br>口コミ作成サポート</h1><p class="lead">当てはまる項目を選ぶだけで、口コミ文の下書きを作れます。<br>内容を確認・修正してからGoogleへご投稿ください。</p><div class="privacy">回答内容は保存・送信されません</div></section>
<section class="card"><h2 class="section-title">満足度を教えてください</h2><div id="stars" class="stars"></div></section>
<div id="questionRoot"></div>
<section class="card"><h2 class="section-title">特に印象に残ったこと</h2><p class="section-note">任意入力です。文章へそのまま加えます。</p><textarea id="freeText" placeholder="例：普段使えていない筋肉を使えた感じがしました"></textarea></section>
<button id="generateBtn" class="btn primary" type="button">口コミ文を作成する</button><div id="error" class="error"></div>
<section id="resultCard" class="card result"><h2 class="section-title">口コミ文の下書き</h2><div id="reviewText" class="review-box" contenteditable="true"></div><div class="meta"><span>この場で自由に編集できます</span><span id="charCount">0文字</span></div><p class="notice">実際の体験と異なる内容がないか確認し、必要に応じて修正してください。</p><button id="regenBtn" class="btn secondary" type="button">別の文章を作る</button><button id="copyBtn" class="btn primary" type="button">文章をコピー</button><div id="copyMessage" class="success"></div><button id="googleBtn" class="btn primary" type="button">Google口コミ画面を開く</button></section>
<footer>このページは口コミ文作成の補助ツールです。<br>入力内容や生成文は外部へ送信・保存されません。</footer>
</main>
<script>
const GOOGLE_REVIEW_URL="https://www.google.com/search?q=Heeeeat%21+伏見桃山";
const categories=[
{id:"program",name:"今回体験したプログラム",required:true,max:2,items:[["program_pilates","マシンピラティス"],["program_semi","セミパーソナルジム"],["program_trx","TRX"],["program_boxing","ボクササイズ"],["program_conditioning","コンディショニング"]]},
{id:"experience",name:"体験について",max:4,items:[["first_safe","初めてでも安心できた"],["easy_explain","説明が分かりやすかった"],["customized","自分の身体に合わせてもらえた"],["fun","楽しく参加できた"],["beginner","運動初心者でも安心だった"],["pace","無理なく身体を動かせた"]]},
{id:"lesson",name:"レッスン内容",max:3,items:[["machine_fun","マシンピラティスが楽しかった"],["semi_support","セミパーソナルでしっかり見てもらえた"],["trx_fresh","TRXが新鮮だった"],["boxing_fun","ボクササイズが楽しかった"],["conditioning_good","コンディショニングで身体が整った"],["variety","いろいろな運動ができて飽きなかった"],["program_rich","プログラムが充実していた"]]},
{id:"staff",name:"インストラクター・スタジオ",max:3,items:[["staff_kind","インストラクターが丁寧だった"],["feedback","フォームを細かく見てもらえた"],["question","質問しやすかった"],["atmosphere","雰囲気が良かった"],["clean","スタジオがきれいだった"],["small_group","少人数で安心できた"],["access","通いやすかった"]]},
{id:"change",name:"感じた変化",max:4,items:[["lighter","身体が軽くなった"],["refresh","身体がすっきりした"],["posture","姿勢を意識できた"],["core","体幹を意識できた"],["sweat","気持ちよく汗をかけた"],["exercise","運動不足解消になった"],["stretch","身体が伸びた感じがした"],["relief","肩や腰が楽になった"]]},
{id:"heeeeat",name:"Heeeeat!の魅力",max:3,items:[["proposal","自分に合ったメニューを提案してもらえた"],["condition","その日の体調に合わせてもらえた"],["many_programs","ピラティス以外もできるのが良かった"],["not_boring","飽きずに続けられそう"],["motivation","運動のモチベーションが上がった"],["habit","運動習慣をつけられそう"],["comfortable","居心地が良かった"]]},
{id:"future",name:"今後について",max:2,items:[["again","また受けたい"],["continue2","続けてみたい"],["recommend","友人にも勧めたい"],["family","家族にも勧めたい"]]}
];
const phrases={
program_pilates:["今回はマシンピラティスを体験しました。","マシンピラティスの体験レッスンに参加しました。","初めてマシンピラティスを受けました。"],program_semi:["今回はセミパーソナルジムを体験しました。","少人数制のセミパーソナルトレーニングに参加しました。","セミパーソナルの体験で伺いました。"],program_trx:["今回はTRXを体験しました。","TRXトレーニングに初めて参加しました。","吊り下げ式のTRXトレーニングを体験しました。"],program_boxing:["今回はボクササイズを体験しました。","ボクササイズのプログラムに参加しました。","音楽に合わせたボクササイズを体験しました。"],program_conditioning:["今回はコンディショニングを体験しました。","身体を整えるコンディショニングのレッスンを受けました。","コンディショニングプログラムに参加しました。"],
first_safe:["初めてでも安心して参加できました。","初回で少し緊張していましたが、すぐに安心できました。","初心者でも取り組みやすい雰囲気でした。"],easy_explain:["動きのポイントを一つずつ分かりやすく説明してもらえました。","説明が具体的で、迷わず身体を動かせました。","なぜこの動きをするのかまで教えてもらえて分かりやすかったです。"],customized:["身体の状態に合わせて内容を調整してもらえました。","自分の体力や癖に合わせて進めてもらえたのが良かったです。","一人ひとりに合わせたアドバイスをもらえました。"],fun:["楽しみながら身体を動かせました。","あっという間に感じるくらい楽しい時間でした。","運動というより、楽しいレッスンとして参加できました。"],beginner:["運動経験が少なくても無理なく取り組めました。","運動が苦手でも置いていかれることなく参加できました。","久しぶりの運動でしたが安心して始められました。"],pace:["自分のペースに合わせてもらえました。","きつすぎず、程よい強度で運動できました。","無理のない範囲で最後まで続けられました。"],
machine_fun:["マシンのサポートがあるので、楽しく身体を動かせました。","マシンを使うことで正しい動きを意識しやすかったです。","自分だけでは難しい動きも、マシンのおかげで取り組みやすかったです。"],semi_support:["少人数なので、しっかり動きを見てもらえました。","セミパーソナルでも一人ひとり丁寧に対応してもらえました。","適度に見てもらいながら、自分のペースでも進められました。"],trx_fresh:["TRXは初めてでしたが、新鮮で楽しかったです。","普段とは違う身体の使い方ができて面白かったです。","自分の体重を使うTRXは、想像以上に達成感がありました。"],boxing_fun:["ボクササイズで気持ちよく身体を動かせました。","音楽に合わせて動けるので、楽しみながら汗をかけました。","ストレス発散にもなり、爽快感がありました。"],conditioning_good:["コンディショニング後は身体が整った感覚がありました。","固まっていた部分がほぐれ、動きやすくなりました。","身体の状態を確認しながら整えてもらえました。"],variety:["いろいろな運動ができるので、飽きずに続けられそうです。","その日の目的に合わせて違うプログラムを選べるのが魅力でした。","一つの運動だけではないので、楽しく通えそうです。"],program_rich:["プログラムの種類が多く、目的に合わせて選べるのが良かったです。","ピラティスからトレーニングまで幅広く受けられるのが魅力だと思いました。","その日の気分や体調に合わせてプログラムを選べるのが便利です。"],
staff_kind:["インストラクターの方が丁寧で、安心感がありました。","優しく声をかけてもらえたので、緊張せずに参加できました。","親しみやすく、質問もしやすい雰囲気でした。"],feedback:["姿勢やフォームを細かく確認してもらえました。","少しの動きの違いまで教えてもらえて分かりやすかったです。","自己流では気づけない身体の使い方を教えてもらえました。"],question:["分からないことをその場ですぐに聞けました。","気軽に質問でき、丁寧に答えてもらえました。","疑問を残さず進められたのが良かったです。"],atmosphere:["明るく入りやすい雰囲気でした。","落ち着いた空間で、リラックスして参加できました。","初めてでも居心地よく過ごせる雰囲気でした。"],clean:["スタジオは清潔感があり、気持ちよく利用できました。","器具や店内もきれいに整えられていました。","清潔で明るいスタジオが好印象でした。"],small_group:["少人数なので周りを気にせず参加できました。","大人数のレッスンよりも丁寧に見てもらえました。","少人数ならではの安心感がありました。"],access:["駅から通いやすく、続けやすそうです。","アクセスが良く、仕事帰りにも利用しやすいと感じました。","無理なく通える場所にあるのが便利です。"],
lighter:["終わった後は身体が軽く感じました。","レッスン後に身体が動かしやすくなりました。","短時間でも身体の軽さを実感できました。"],refresh:["身体がすっきりして、気分もリフレッシュできました。","運動後は気持ちまで軽くなりました。","良い気分転換になりました。"],posture:["自分の姿勢の癖に気づくことができました。","普段から正しい姿勢を意識するきっかけになりました。","姿勢を整える感覚が少し分かりました。"],core:["普段意識していない体幹をしっかり使えました。","身体の中心を意識しながら動けました。","体幹に効いている感覚がありました。"],sweat:["気持ちよく汗をかけました。","しっかり身体を動かせて爽快感がありました。","程よく汗をかき、達成感がありました。"],exercise:["運動不足解消にぴったりだと感じました。","久しぶりにしっかり身体を動かせました。","無理なく運動不足を解消できそうです。"],stretch:["普段伸ばせていない部分まで気持ちよく伸ばせました。","身体がほぐれていく感覚がありました。","レッスン後は身体が伸びて動きやすくなりました。"],relief:["肩や腰まわりが楽になったように感じました。","固まっていた身体がほぐれました。","終わった後は肩まわりがすっきりしました。"],
proposal:["目的に合ったメニューを提案してもらえました。","その人に合わせてプログラムを選んでもらえるのが良かったです。","自分に合う運動を一緒に考えてもらえました。"],condition:["その日の体調に合わせて内容を調整してもらえました。","無理をさせず、状態を見ながら進めてもらえました。","体調や身体の状態に合わせてもらえるので安心です。"],many_programs:["ピラティス以外の運動も選べるのが魅力でした。","一つのスタジオでさまざまな運動ができるのが便利です。","その日の気分に合わせて違う運動を楽しめそうです。"],not_boring:["いろいろなプログラムがあるので飽きずに続けられそうです。","毎回違う刺激があり、楽しみながら通えそうです。","単調にならず、長く続けやすいと感じました。"],motivation:["楽しく運動できて、これからのモチベーションが上がりました。","一人では続かない運動も、ここなら頑張れそうです。","身体を動かすことが楽しみになりそうです。"],habit:["無理なく運動習慣をつけられそうです。","定期的に通うきっかけになりそうです。","生活の中に運動を取り入れやすいと感じました。"],comfortable:["スタッフの方との距離感も程よく、居心地が良かったです。","緊張せずに過ごせる空間でした。","また来たいと思える雰囲気でした。"],
again:["またレッスンを受けたいです。","次回も楽しみにしています。","ぜひもう一度参加したいです。"],continue2:["これからも続けてみたいと思います。","無理なく継続できそうです。","今後も定期的に通ってみたいです。"],recommend:["運動を始めたい友人にもおすすめしたいです。","初心者の方にもおすすめできると思います。","同じような悩みがある友人にも勧めたいです。"],family:["家族にも勧めたいと思いました。","家族と一緒に通うのも良さそうです。","身体を動かしたい家族にも紹介したいです。"]};
let rating=0;function pick(a){return a[Math.floor(Math.random()*a.length)]}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function renderStars(){const r=document.getElementById("stars");for(let i=1;i<=5;i++){const b=document.createElement("button");b.className="star";b.type="button";b.textContent="★";b.onclick=()=>{rating=i;[...r.children].forEach((x,n)=>x.classList.toggle("on",n<i))};r.appendChild(b)}}
function renderQuestions(){const root=document.getElementById("questionRoot");categories.forEach(c=>{const s=document.createElement("section");s.className="card";const h=document.createElement("h2");h.className="section-title";h.textContent=c.name+(c.required?"（必須）":"");const n=document.createElement("p");n.className="section-note";n.textContent="最大"+c.max+"つまで選択";const chips=document.createElement("div");chips.className="chips";c.items.forEach(([id,label])=>{const b=document.createElement("button");b.type="button";b.className="chip";b.dataset.id=id;b.textContent=label;b.onclick=()=>{const sel=chips.querySelectorAll(".selected");if(!b.classList.contains("selected")&&sel.length>=c.max)return;b.classList.toggle("selected")};chips.appendChild(b)});s.append(h,n,chips);root.appendChild(s)})}
function selected(){return[...document.querySelectorAll(".chip.selected")].map(x=>x.dataset.id)}
function build(){const s=selected(),p=s.filter(x=>x.startsWith("program_"));if(!p.length)throw new Error("体験したプログラムを1つ以上選択してください。");if(s.length<3)throw new Error("感想項目を合計3つ以上選択してください。");const e=new Set(["again","continue2","recommend","family"]),parts=[pick(phrases[p[0]])];shuffle(s.filter(x=>!x.startsWith("program_")&&!e.has(x))).slice(0,4).forEach(x=>parts.push(pick(phrases[x])));const f=document.getElementById("freeText").value.trim();if(f)parts.push(/[。！？!?]$/.test(f)?f:f+"。");const end=s.filter(x=>e.has(x));if(end.length)parts.push(pick(phrases[pick(end)]));return parts.join("")}
function count(){const t=document.getElementById("reviewText").innerText.trim();document.getElementById("charCount").textContent=t.length+"文字"}
document.getElementById("generateBtn").onclick=()=>{document.getElementById("error").textContent="";try{document.getElementById("reviewText").textContent=build();document.getElementById("resultCard").style.display="block";count();document.getElementById("resultCard").scrollIntoView({behavior:"smooth"})}catch(e){document.getElementById("error").textContent=e.message}};
document.getElementById("regenBtn").onclick=()=>{try{document.getElementById("reviewText").textContent=build();count()}catch(e){document.getElementById("error").textContent=e.message}};document.getElementById("reviewText").oninput=count;
document.getElementById("copyBtn").onclick=async()=>{const t=document.getElementById("reviewText").innerText.trim();if(!t)return;try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}document.getElementById("copyMessage").textContent="コピーしました。Google口コミ画面で貼り付けてください。"};document.getElementById("googleBtn").onclick=()=>window.open(GOOGLE_REVIEW_URL,"_blank","noopener,noreferrer");renderStars();renderQuestions();
</script>
</body>
</html>
